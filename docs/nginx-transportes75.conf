# /etc/nginx/sites-available/transportes75.com.br
# Config Nginx para Transportes75 — mesma VPS do Desmonte75
# Aplicar:
#   sudo cp /caminho/transportes75.com.br /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/transportes75.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 443 ssl http2;
    server_name transportes75.com.br www.transportes75.com.br;

    access_log /var/log/nginx/transportes75-access.log cf_real;
    error_log /var/log/nginx/transportes75-error.log;

    # SSL via Cloudflare (Flexible/Full) — sem cert local necessário
    # Se for usar cert próprio (Let's Encrypt):
    # ssl_certificate /etc/letsencrypt/live/transportes75.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/transportes75.com.br/privkey.pem;

    root /var/www/transportes75;
    index index.html;

    # URLs limpas (sem .html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # robots.txt e sitemap
    location = /robots.txt {
        try_files /robots.txt =404;
    }
    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    # Blog → /blog/artigo redireciona para /artigo.html (mesmo padrão Desmonte75)
    location /blog/ {
        rewrite ^/blog/(.+)$ /$1.html last;
    }
    location = /blog {
        try_files /blog.html =404;
    }

    # CSS/JS/Img cache longo
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bloqueia tentativa de acesso a arquivos sensíveis
    location ~* /(\.env|\.git|wp-config|\.htaccess) {
        deny all;
        return 404;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
